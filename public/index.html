<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenapp | Connect & Chat</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00a884">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .wa-header { background: #00a884; }
        .wa-bubble-out { background: #d9fdd3; border-radius: 8px 0px 8px 8px; }
        .wa-bubble-in { background: #ffffff; border-radius: 0px 8px 8px 8px; }
    </style>
</head>
<body class="bg-[#efeae2] text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- WhatsApp-Style Header -->
    <header class="wa-header text-white px-4 py-3 flex justify-between items-center shadow-md sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center font-black text-lg">🟢</div>
            <div>
                <h1 id="headerTitle" class="font-bold text-lg leading-tight">Greenapp</h1>
                <p id="connectionStatus" class="text-xs text-emerald-100 font-medium">⚡ Connected (Online)</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="showScreen('menu')" class="text-xs bg-white/20 hover:bg-white/30 text-white font-bold px-2.5 py-1 rounded-lg transition">🏠 Menu</button>
        </div>
    </header>

    <!-- MAIN CONTAINER VIEWS -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 overflow-y-auto">

        <!-- VIEW 1: MAIN MENU (WhatsApp Style Hub) -->
        <div id="screen-menu" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 text-center space-y-2">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-black">🟢</div>
                <h2 class="text-xl font-black text-slate-900">Welcome to Greenapp</h2>
                <p class="text-xs text-slate-500">Your secure space for chats, offline messaging, and local connections.</p>
            </div>

            <div class="space-y-2.5">
                <!-- Find a Date Option -->
                <button onclick="showScreen('dating')" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white p-4 rounded-2xl shadow-md flex items-center justify-between hover:opacity-95 transition">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl bg-white/20 p-2.5 rounded-xl">💖</span>
                        <div class="text-left">
                            <h3 class="font-bold text-sm">Find a Date</h3>
                            <p class="text-[11px] text-pink-100">Discover profiles & spark new connections</p>
                        </div>
                    </div>
                    <span class="text-lg font-bold">→</span>
                </button>

                <!-- Start a Chat Option -->
                <button onclick="showScreen('chat')" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:bg-slate-50 transition">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl bg-emerald-50 p-2.5 rounded-xl text-emerald-600">💬</span>
                        <div class="text-left">
                            <h3 class="font-bold text-sm text-slate-900">Chats & Messages</h3>
                            <p class="text-[11px] text-slate-500">Offline queueing & active conversations</p>
                        </div>
                    </div>
                    <span class="text-lg font-bold text-slate-400">→</span>
                </button>

                <!-- Contacts Sync Option -->
                <button onclick="syncContacts()" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:bg-slate-50 transition">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl bg-blue-50 p-2.5 rounded-xl text-blue-600">📇</span>
                        <div class="text-left">
                            <h3 class="font-bold text-sm text-slate-900">Sync Contacts</h3>
                            <p class="text-[11px] text-slate-500">Find friends already on Greenapp</p>
                        </div>
                    </div>
                    <span class="text-xs bg-blue-100 text-blue-700 font-bold px-2 py-1 rounded-lg">Sync</span>
                </button>

                <!-- Invite Friends Option -->
                <button onclick="inviteFriends()" class="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between hover:bg-slate-50 transition">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl bg-amber-50 p-2.5 rounded-xl text-amber-600">🔗</span>
                        <div class="text-left">
                            <h3 class="font-bold text-sm text-slate-900">Invite Friends</h3>
                            <p class="text-[11px] text-slate-500">Share your invite link with others</p>
                        </div>
                    </div>
                    <span class="text-xs bg-amber-100 text-amber-800 font-bold px-2 py-1 rounded-lg">Share</span>
                </button>
            </div>
        </div>

        <!-- VIEW 2: FIND A DATE HUB -->
        <div id="screen-dating" class="hidden space-y-4">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-xs uppercase tracking-wider font-bold text-slate-500">Local Matches Nearby</h3>
                <span class="text-xs text-pink-600 font-medium">Active now</span>
            </div>

            <!-- Match Card Example -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="h-48 bg-gradient-to-tr from-pink-400 to-purple-500 flex items-end p-4 text-white">
                    <div>
                        <h4 class="text-lg font-bold">Brenda, 22</h4>
                        <p class="text-xs text-pink-100">2 km away • Coffee & Tech lover</p>
                    </div>
                </div>
                <div class="p-4 flex gap-2">
                    <button onclick="alert('Passed!')" class="w-1/2 border border-slate-300 text-slate-600 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-50">✕ Pass</button>
                    <button onclick="alert('Matched! Opening secure chat room.')" class="w-1/2 bg-pink-500 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-pink-600 shadow">💖 Like & Chat</button>
                </div>
            </div>
        </div>

        <!-- VIEW 3: CHAT ROOM -->
        <div id="screen-chat" class="hidden space-y-3">
            <div id="chatContainer" class="space-y-3">
                <!-- Chat history injected here -->
            </div>
        </div>

    </main>

    <!-- Message Input Bar (Only visible inside Chat View) -->
    <div id="chatInputBar" class="hidden fixed bottom-0 left-0 right-0 bg-[#f0f2f5] p-3 border-t border-slate-300 max-w-md mx-auto flex items-center gap-2">
        <input type="text" id="messageInput" placeholder="Type a message (works offline)..." class="flex-1 bg-white border border-slate-300 rounded-full py-2.5 px-4 text-sm focus:outline-none focus:border-[#00a884]">
        <button onclick="sendMessage()" class="wa-header text-white w-10 h-10 rounded-full flex items-center justify-center shadow hover:opacity-90 transition font-bold text-lg">➤</button>
    </div>

    <script>
        function showScreen(screen) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-dating').classList.add('hidden');
            document.getElementById('screen-chat').classList.add('hidden');
            document.getElementById('chatInputBar').classList.add('hidden');

            if(screen === 'menu') {
                document.getElementById('screen-menu').classList.remove('hidden');
                document.getElementById('headerTitle').innerText = 'Greenapp';
            } else if(screen === 'dating') {
                document.getElementById('screen-dating').classList.remove('hidden');
                document.getElementById('headerTitle').innerText = 'Find a Date 💖';
            } else if(screen === 'chat') {
                document.getElementById('screen-chat').classList.remove('hidden');
                document.getElementById('chatInputBar').classList.remove('hidden');
                document.getElementById('headerTitle').innerText = 'Greenapp Chat';
                renderMessages();
            }
        }

        async function syncContacts() {
            if ('contacts' in navigator && 'select' in navigator.contacts) {
                try {
                    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    alert(`Successfully synced ${contacts.length} contacts from your phone!`);
                } catch (ex) {
                    alert('Contact sync cancelled or permission denied.');
                }
            } else {
                alert('📇 Contacts permission simulated: 14 contacts found on device and matched to Greenapp!');
            }
        }

        function inviteFriends() {
            const inviteText = "Join me on Greenapp—the free offline messenger and dating hub! Download it here: " + window.location.origin;
            if (navigator.share) {
                navigator.share({ title: 'Greenapp Invite', text: inviteText, url: window.location.origin });
            } else {
                navigator.clipboard.writeText(inviteText);
                alert('Invite link copied to clipboard to share with friends!');
            }
        }

        // Chat logic
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        let messages = JSON.parse(localStorage.getItem('greenapp_msgs') || '[]');

        function renderMessages() {
            chatContainer.innerHTML = `
                <div class="flex justify-start">
                    <div class="wa-bubble-in p-3 max-w-[80%] shadow-sm text-sm">
                        <p class="font-bold text-xs text-emerald-700 mb-0.5">Greenapp System</p>
                        <p>Welcome to your chat room! Messages queue locally when offline and sync automatically[span_1](start_span)[span_1](end_span).</p>
                        <span class="text-[9px] text-slate-400 block text-right mt-1">Just now</span>
                    </div>
                </div>
            `;
            messages.forEach(msg => {
                chatContainer.innerHTML += `
                    <div class="flex justify-end">
                        <div class="wa-bubble-out p-3 max-w-[80%] shadow-sm text-sm">
                            <p>${msg.text}</p>
                            <div class="flex justify-end items-center gap-1 mt-1">
                                <span class="text-[9px] text-slate-500">${msg.time}</span>
                                <span class="text-[10px] font-bold ${msg.synced ? 'text-blue-500' : 'text-amber-600'}">
                                    ${msg.synced ? '✓✓' : '⏱ Queued'}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if(!text) return;
            const newMsg = {
                id: Date.now(),
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                synced: navigator.onLine
            };
            messages.push(newMsg);
            localStorage.setItem('greenapp_msgs', JSON.stringify(messages));
            messageInput.value = '';
            renderMessages();

            if (navigator.onLine) {
                setTimeout(() => {
                    newMsg.synced = true;
                    localStorage.setItem('greenapp_msgs', JSON.stringify(messages));
                    renderMessages();
                }, 800);
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
