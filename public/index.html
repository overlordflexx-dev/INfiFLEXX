<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East West | Connect & Chat</title>
    <link rel="manifest" href="/manifest.json">
    <meta id="themeColorMeta" name="theme-color" content="#00a884">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .theme-green { background-color: #00a884; }
        .theme-spider { background-color: #dc2626; }
        .theme-starwars { background-color: #1e293b; }
        .theme-barbie { background-color: #db2777; }
        
        /* Face Colors */
        .face-cream { background-color: #efeae2; color: #1e293b; }
        .face-dark { background-color: #111827; color: #f3f4f6; }
        .face-grey { background-color: #f1f5f9; color: #0f172a; }
        .face-white { background-color: #ffffff; color: #1e293b; }

        /* 3D Text Effect */
        .text-3d {
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3), 4px 4px 0px rgba(0,0,0,0.15);
        }

        /* Animated Glowing Gradient Background */
        body.neon-glow-bg {
            background-color: #000000;
            color: #f3f4f6;
            position: relative;
            overflow: hidden;
        }

        body.neon-glow-bg::before,
        body.neon-glow-bg::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            opacity: 0.45;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        body.neon-glow-bg::before {
            top: -40px;
            left: -40px;
            background: linear-gradient(135deg, #dc2626, #db2777);
        }

        body.neon-glow-bg::after {
            bottom: 20px;
            right: -40px;
            background: linear-gradient(135deg, #db2777, #dc2626);
            animation-delay: 4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.35; }
            50% { transform: scale(1.15); opacity: 0.55; }
            100% { transform: scale(1); opacity: 0.35; }
        }

        /* Glowing Speck Particle Animation */
        @keyframes floatSpeck {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        .speck {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: floatSpeck 0.8s ease-out forwards;
            box-shadow: 0 0 10px currentColor;
        }
    </style>
</head>
<body id="appBody" class="neon-glow-bg h-screen w-screen flex flex-col justify-between font-sans overflow-hidden select-none m-0 p-0">

    <!-- Floating Rounded Top Header -->
    <header class="w-full p-3 z-50 shrink-0">
        <div id="headerBg" class="theme-green text-white px-4 py-3 flex justify-between items-center shadow-2xl rounded-2xl transition-colors duration-300 max-w-md mx-auto w-full">
            <div class="flex items-center space-x-3">
                <button onclick="goBack()" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm hover:bg-white/30 transition">←</button>
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-xl shadow-inner">✌🏽</div>
                    <div>
                        <h1 id="headerTitle" class="font-black text-lg tracking-wider text-3d uppercase leading-tight">East West</h1>
                        <p class="text-[9px] text-emerald-100 font-medium tracking-wide">Vibes & Connections</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleSettings(true)" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-bold text-lg hover:bg-white/30 transition">⋮</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER VIEWS -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 relative z-10 overflow-hidden flex flex-col justify-center items-center">

        <!-- VIEW 1: DASHBOARD / HOME (Three Rectangular Action Buttons with Glowing Specks) -->
        <div id="screen-menu" class="space-y-3.5 text-center h-full w-full flex flex-col justify-center items-center px-6">
            <button onclick="triggerSpecks(event, 'For You')" class="relative overflow-hidden w-full py-4 px-6 rounded-2xl bg-slate-900/80 hover:bg-slate-800/90 border border-slate-700/60 shadow-lg text-white font-bold text-sm tracking-wide transition active:scale-95">
                ✨ For You
            </button>
            <button onclick="triggerSpecks(event, 'Feed')" class="relative overflow-hidden w-full py-4 px-6 rounded-2xl bg-slate-900/80 hover:bg-slate-800/90 border border-slate-700/60 shadow-lg text-white font-bold text-sm tracking-wide transition active:scale-95">
                🔥 Feed
            </button>
            <button onclick="triggerSpecks(event, 'Add')" class="relative overflow-hidden w-full py-4 px-6 rounded-2xl bg-slate-900/80 hover:bg-slate-800/90 border border-slate-700/60 shadow-lg text-white font-bold text-sm tracking-wide transition active:scale-95">
                ➕ Add
            </button>
        </div>

        <!-- VIEW 2: FIND A DATE -->
        <div id="screen-dating" class="hidden space-y-4 h-full w-full flex flex-col justify-center">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-xs uppercase tracking-wider font-bold text-pink-400">Local Matches Nearby</h3>
                <span class="text-xs text-pink-500 font-medium">Active now</span>
            </div>
            <div class="bg-slate-900/90 backdrop-blur-md rounded-3xl shadow-lg border border-slate-800 overflow-hidden w-full">
                <div class="h-44 bg-gradient-to-tr from-pink-600 to-rose-600 flex items-end p-4 text-white">
                    <div>
                        <h4 class="text-lg font-bold">Brenda, 22</h4>
                        <p class="text-xs text-pink-100">2 km away • Coffee & Tech lover</p>
                    </div>
                </div>
                <div class="p-3.5 flex gap-2">
                    <button onclick="alert('Passed!')" class="w-1/2 border border-slate-700 text-slate-300 py-2 rounded-2xl text-xs font-bold hover:bg-slate-800">✕ Pass</button>
                    <button onclick="alert('Matched! Opening secure chat room.')" class="w-1/2 bg-pink-600 text-white py-2 rounded-2xl text-xs font-bold hover:bg-pink-700 shadow">💖 Like & Chat</button>
                </div>
            </div>
        </div>

        <!-- VIEW 3: CHAT ROOM -->
        <div id="screen-chat" class="hidden flex-1 w-full overflow-y-auto space-y-3 py-2">
            <div id="chatContainer" class="space-y-3"></div>
        </div>

    </main>

    <!-- Message Input Bar -->
    <div id="chatInputBar" class="hidden shrink-0 bg-slate-900/95 backdrop-blur-md p-3 border-t border-slate-800 max-w-md mx-auto w-full flex items-center gap-2 z-40">
        <input type="text" id="messageInput" placeholder="Type a message (works offline)..." class="flex-1 bg-slate-800 text-white placeholder-slate-400 border border-slate-700 rounded-full py-2 px-4 text-sm focus:outline-none focus:border-emerald-500">
        <button id="sendBtn" onclick="sendMessage()" class="theme-green text-white w-9 h-9 rounded-full flex items-center justify-center shadow hover:opacity-90 transition font-bold text-base">➤</button>
    </div>

    <!-- FLOATING ROUNDED BOTTOM DASHBOARD DOCK -->
    <div class="w-full p-3 shrink-0 z-50">
        <nav class="bg-slate-900/95 backdrop-blur-xl border border-slate-800 py-2.5 px-4 max-w-md mx-auto w-full flex justify-around items-center rounded-3xl shadow-2xl">
            
            <button onclick="showScreen('menu')" class="flex flex-col items-center text-cyan-400 hover:scale-110 transition group">
                <div class="w-8 h-8 rounded-xl bg-cyan-500/20 flex items-center justify-center border border-cyan-500/40 shadow-inner">
                    <svg class="w-5 h-5 fill-cyan-400" viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H5v-9H2l10-8z"/></svg>
                </div>
                <span class="text-[9px] font-bold mt-1 text-slate-300">Home</span>
            </button>

            <button onclick="showScreen('dating')" class="flex flex-col items-center text-pink-400 hover:scale-110 transition group">
                <div class="w-8 h-8 rounded-xl bg-pink-500/20 flex items-center justify-center border border-pink-500/40 shadow-inner text-sm">💖</div>
                <span class="text-[9px] font-bold mt-1 text-slate-300">Find Date</span>
            </button>

            <button onclick="showScreen('chat')" class="flex flex-col items-center text-emerald-400 hover:scale-110 transition group">
                <div class="w-8 h-8 rounded-xl bg-emerald-500/20 flex items-center justify-center border border-emerald-500/40 shadow-inner">
                    <svg class="w-5 h-5 fill-emerald-400" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                </div>
                <span class="text-[9px] font-bold mt-1 text-slate-300">Chats</span>
            </button>

            <button onclick="syncContacts()" class="flex flex-col items-center text-blue-400 hover:scale-110 transition group">
                <div class="w-8 h-8 rounded-xl bg-blue-500/20 flex items-center justify-center border border-blue-500/40 shadow-inner text-sm">📇</div>
                <span class="text-[9px] font-bold mt-1 text-slate-300">Contacts</span>
            </button>

            <button onclick="inviteFriends()" class="flex flex-col items-center text-amber-400 hover:scale-110 transition group">
                <div class="w-8 h-8 rounded-xl bg-amber-500/20 flex items-center justify-center border border-amber-500/40 shadow-inner text-sm">🔗</div>
                <span class="text-[9px] font-bold mt-1 text-slate-300">Invite</span>
            </button>

        </nav>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 text-slate-100 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-3.5 animate-in fade-in duration-200 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
                <h3 class="font-black text-sm text-slate-100">⚙️ Settings & Support</h3>
                <button onclick="toggleSettings(false)" class="w-7 h-7 bg-slate-800 rounded-full flex items-center justify-center font-bold text-slate-300 hover:bg-slate-700">✕</button>
            </div>

            <div class="space-y-1 bg-slate-800/60 p-2.5 rounded-2xl border border-slate-700/50 text-xs text-slate-300">
                <p class="font-bold text-slate-200 mb-0.5">📞 Support & Contact</p>
                <p><b>Phone:</b> +254 700 000 000</p>
                <p><b>Email:</b> support@eastwest.live</p>
            </div>

            <div class="space-y-1">
                <label class="font-bold text-[11px] text-slate-300 block">🎨 App Face Color</label>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="setFaceColor('cream')" class="p-2 rounded-xl bg-[#efeae2] text-slate-800 text-[11px] font-bold border border-slate-300 shadow-sm">Warm Cream</button>
                    <button onclick="setFaceColor('dark')" class="p-2 rounded-xl bg-[#111827] text-white text-[11px] font-bold shadow-sm">Dark AMOLED</button>
                    <button onclick="setFaceColor('grey')" class="p-2 rounded-xl bg-[#f1f5f9] text-slate-800 text-[11px] font-bold border border-slate-200 shadow-sm">Cool Grey</button>
                    <button onclick="setFaceColor('neon')" class="p-2 rounded-xl bg-black text-pink-400 text-[11px] font-bold border border-slate-800 shadow-sm">Neon Glow</button>
                </div>
            </div>

            <div class="space-y-1">
                <label class="font-bold text-[11px] text-slate-300 block">✨ Header & Accent Themes</label>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="setTheme('green')" class="p-2 rounded-xl bg-emerald-600 text-white text-[11px] font-bold shadow-sm">Classic Green</button>
                    <button onclick="setTheme('spider')" class="p-2 rounded-xl bg-red-600 text-white text-[11px] font-bold shadow-sm">Spider-Man</button>
                    <button onclick="setTheme('starwars')" class="p-2 rounded-xl bg-slate-800 text-white text-[11px] font-bold shadow-sm">Star Wars</button>
                    <button onclick="setTheme('barbie')" class="p-2 rounded-xl bg-pink-600 text-white text-[11px] font-bold shadow-sm">Barbie</button>
                </div>
            </div>

            <div class="pt-1.5 border-t border-slate-800 text-center">
                <span class="text-[9px] bg-slate-800 text-slate-400 font-bold px-3 py-1 rounded-full">🚀 Ongoing Project: East West v2.0</span>
            </div>
        </div>
    </div>

    <script>
        let currentTheme = localStorage.getItem('eastwest_theme') || 'green';
        let currentFace = localStorage.getItem('eastwest_face') || 'neon';
        setTheme(currentTheme, false);
        setFaceColor(currentFace, false);

        function setTheme(theme, save = true) {
            currentTheme = theme;
            if(save) localStorage.setItem('eastwest_theme', theme);

            const headerBg = document.getElementById('headerBg');
            const sendBtn = document.getElementById('sendBtn');
            const themeColorMeta = document.getElementById('themeColorMeta');

            headerBg.className = "text-white px-4 py-3 flex justify-between items-center shadow-2xl rounded-2xl transition-colors duration-350 max-w-md mx-auto w-full " + 
                (theme === 'spider' ? 'theme-spider' : theme === 'starwars' ? 'theme-starwars' : theme === 'barbie' ? 'theme-barbie' : 'theme-green');

            if(sendBtn) {
                sendBtn.className = "text-white w-9 h-9 rounded-full flex items-center justify-center shadow hover:opacity-90 transition font-bold text-base " + 
                    (theme === 'spider' ? 'theme-spider' : theme === 'starwars' ? 'theme-starwars' : theme === 'barbie' ? 'theme-barbie' : 'theme-green');
            }

            themeColorMeta.setAttribute('content', theme === 'spider' ? '#dc2626' : theme === 'starwars' ? '#1e293b' : theme === 'barbie' ? '#db2777' : '#00a884');
            toggleSettings(false);
        }

        function setFaceColor(face, save = true) {
            currentFace = face;
            if(save) localStorage.setItem('eastwest_face', face);

            const body = document.getElementById('appBody');
            if(face === 'dark') {
                body.className = "face-dark h-screen w-screen flex flex-col justify-between font-sans overflow-hidden select-none m-0 p-0";
            } else if(face === 'grey') {
                body.className = "face-grey h-screen w-screen flex flex-col justify-between font-sans overflow-hidden select-none m-0 p-0";
            } else if(face === 'white') {
                body.className = "face-white h-screen w-screen flex flex-col justify-between font-sans overflow-hidden select-none m-0 p-0";
            } else if(face === 'cream') {
                body.className = "face-cream h-screen w-screen flex flex-col justify-between font-sans overflow-hidden select-none m-0 p-0";
            } else {
                body.className = "neon-glow-bg h-screen w-screen flex flex-col justify-between font-sans overflow-hidden select-none m-0 p-0";
            }
            toggleSettings(false);
        }

        // Glowing Specks Effect Function
        function triggerSpecks(e, btnName) {
            const btn = e.currentTarget;
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const colors = ['#38bdf8', '#ec4899', '#10b981', '#f59e0b', '#a855f7'];

            for (let i = 0; i < 12; i++) {
                const speck = document.createElement('span');
                speck.className = 'speck';
                speck.style.left = `${x}px`;
                speck.style.top = `${y}px`;
                speck.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                speck.style.color = speck.style.backgroundColor;

                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 60;
                speck.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                speck.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);

                btn.appendChild(speck);
                setTimeout(() => speck.remove(), 800);
            }

            if(btnName === 'For You') alert('✨ Opening For You stream...');
            else if(btnName === 'Feed') alert('🔥 Opening live feed...');
            else if(btnName === 'Add') alert('➕ Ready to add new connection!');
        }

        function showScreen(screen) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-dating').classList.add('hidden');
            document.getElementById('screen-chat').classList.add('hidden');
            document.getElementById('chatInputBar').classList.add('hidden');

            if(screen === 'menu') {
                document.getElementById('screen-menu').classList.remove('hidden');
            } else if(screen === 'dating') {
                document.getElementById('screen-dating').classList.remove('hidden');
            } else if(screen === 'chat') {
                document.getElementById('screen-chat').classList.remove('hidden');
                document.getElementById('chatInputBar').classList.remove('hidden');
                renderMessages();
            }
        }

        function goBack() {
            showScreen('menu');
        }

        function toggleSettings(show) {
            const modal = document.getElementById('settingsModal');
            if(show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        async function syncContacts() {
            alert('📇 Contacts synced successfully from device!');
        }

        function inviteFriends() {
            const inviteText = "Join me on East West! Download it here: " + window.location.origin;
            if (navigator.share) {
                navigator.share({ title: 'East West Invite', text: inviteText, url: window.location.origin });
            } else {
                navigator.clipboard.writeText(inviteText);
                alert('Invite link copied to clipboard!');
            }
        }

        // Chat logic
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        let messages = JSON.parse(localStorage.getItem('eastwest_msgs') || '[]');

        function renderMessages() {
            chatContainer.innerHTML = `
                <div class="flex justify-start">
                    <div class="bg-slate-800 text-slate-100 p-3 max-w-[80%] rounded-2xl shadow-sm text-sm border border-slate-700">
                        <p class="font-bold text-xs text-emerald-400 mb-0.5">East West System</p>
                        <p>Welcome! Offline messages queue locally and auto-sync when online.</p>
                        <span class="text-[9px] text-slate-400 block text-right mt-1">Just now</span>
                    </div>
                </div>
            `;
            messages.forEach(msg => {
                chatContainer.innerHTML += `
                    <div class="flex justify-end">
                        <div class="bg-emerald-600 text-white p-3 max-w-[80%] rounded-2xl shadow-sm text-sm">
                            <p>${msg.text}</p>
                            <div class="flex justify-end items-center gap-1 mt-1">
                                <span class="text-[9px] text-slate-200">${msg.time}</span>
                                <span class="text-[10px] font-bold ${msg.synced ? 'text-cyan-200' : 'text-amber-300'}">
                                    ${msg.synced ? '✓✓' : '⏱ Queued'}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if(!text) return;
            const newMsg = {
                id: Date.now(),
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                synced: navigator.onLine
            };
            messages.push(newMsg);
            localStorage.setItem('eastwest_msgs', JSON.stringify(messages));
            messageInput.value = '';
            renderMessages();

            if (navigator.onLine) {
                setTimeout(() => {
                    newMsg.synced = true;
                    localStorage.setItem('eastwest_msgs', JSON.stringify(messages));
                    renderMessages();
                }, 800);
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
