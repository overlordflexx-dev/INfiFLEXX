<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenapp | Free Offline Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .wa-header { background: #00a884; }
        .wa-bubble-out { background: #d9fdd3; border-radius: 8px 0px 8px 8px; }
        .wa-bubble-in { background: #ffffff; border-radius: 0px 8px 8px 8px; }
    </style>
</head>
<body class="bg-[#efeae2] text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- WhatsApp-Style Header -->
    <header class="wa-header text-white px-4 py-3 flex justify-between items-center shadow-md sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center font-black text-lg">🟢</div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Greenapp</h1>
                <p id="connectionStatus" class="text-xs text-emerald-100 font-medium">⚡ Connected (Online)</p>
            </div>
        </div>
        <span id="offlineBadge" class="hidden text-[10px] bg-amber-500 text-white font-bold px-2 py-0.5 rounded-full shadow animate-pulse">OFFLINE MODE</span>
    </header>

    <!-- Chat Messages Stream -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-3 overflow-y-auto pb-24" id="chatContainer">
        <!-- Intro Message -->
        <div class="flex justify-start">
            <div class="wa-bubble-in p-3 max-w-[80%] shadow-sm text-sm">
                <p class="font-bold text-xs text-emerald-700 mb-0.5">Greenapp System</p>
                <p>Welcome! Type your message below. Even if your network drops or you go <b>offline</b>, hit send—it will queue up locally and sync instantly when you're back online! 🟢</p>
                <span class="text-[9px] text-slate-400 block text-right mt-1">Just now</span>
            </div>
        </div>
        <!-- Dynamic local messages appear here -->
    </main>

    <!-- Message Input Bar (Fixed Bottom) -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#f0f2f5] p-3 border-t border-slate-300 max-w-md mx-auto flex items-center gap-2">
        <input type="text" id="messageInput" placeholder="Type a message (works offline)..." class="flex-1 bg-white border border-slate-300 rounded-full py-2.5 px-4 text-sm focus:outline-none focus:border-[#00a884]">
        <button onclick="sendMessage()" class="wa-header text-white w-10 h-10 rounded-full flex items-center justify-center shadow hover:opacity-90 transition font-bold text-lg">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const connectionStatus = document.getElementById('connectionStatus');
        const offlineBadge = document.getElementById('offlineBadge');

        // Load queued messages from phone's local storage on startup
        let messages = JSON.parse(localStorage.getItem('greenapp_msgs') || '[]');
        renderMessages();

        // Monitor online/offline status live
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        function updateNetworkStatus() {
            if (navigator.onLine) {
                connectionStatus.innerText = "⚡ Connected (Online)";
                offlineBadge.classList.add('hidden');
                syncOfflineMessages();
            } else {
                connectionStatus.innerText = "🔌 Offline - Messages will queue";
                offlineBadge.classList.remove('hidden');
            }
        }

        function renderMessages() {
            chatContainer.innerHTML = `
                <div class="flex justify-start">
                    <div class="wa-bubble-in p-3 max-w-[80%] shadow-sm text-sm">
                        <p class="font-bold text-xs text-emerald-700 mb-0.5">Greenapp System</p>
                        <p>Welcome! Type your message below. Even if your network drops or you go <b>offline</b>, hit send—it will queue up locally and sync instantly when you're back online! 🟢</p>
                        <span class="text-[9px] text-slate-400 block text-right mt-1">Just now</span>
                    </div>
                </div>
            `;

            messages.forEach(msg => {
                chatContainer.innerHTML += `
                    <div class="flex justify-end">
                        <div class="wa-bubble-out p-3 max-w-[80%] shadow-sm text-sm">
                            <p>${msg.text}</p>
                            <div class="flex justify-end items-center gap-1 mt-1">
                                <span class="text-[9px] text-slate-500">${msg.time}</span>
                                <span class="text-[10px] font-bold ${msg.synced ? 'text-blue-500' : 'text-amber-600'}">
                                    ${msg.synced ? '✓✓' : '⏱ Queued'}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if(!text) return;

            const newMsg = {
                id: Date.now(),
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                synced: navigator.onLine
            };

            messages.push(newMsg);
            localStorage.setItem('greenapp_msgs', JSON.stringify(messages));
            messageInput.value = '';
            renderMessages();

            if (navigator.onLine) {
                // Simulate server dispatch
                setTimeout(() => {
                    newMsg.synced = true;
                    localStorage.setItem('greenapp_msgs', JSON.stringify(messages));
                    renderMessages();
                }, 800);
            }
        }

        function syncOfflineMessages() {
            let updated = false;
            messages.forEach(m => {
                if(!m.synced) {
                    m.synced = true;
                    updated = true;
                }
            });
            if(updated) {
                localStorage.setItem('greenapp_msgs', JSON.stringify(messages));
                renderMessages();
            }
        }

        updateNetworkStatus();
    </script>
</body>
</html>
