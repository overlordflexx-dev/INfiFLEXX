<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexx | Live Gigs & Cyber Command Center</title>
    <!-- Tailwind CSS CDN for mobile-friendly styling without build tools -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(20, 20, 25, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-glow { text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
    </style>
</head>
<body class="bg-[#0a0a0c] text-white min-h-screen font-sans p-4">
    <!-- Header -->
    <header class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
        <h1 class="text-2xl font-black tracking-wider text-[#00f2fe] neon-glow">FLEXX<span class="text-purple-500">.</span></h1>
        <span class="text-xs px-3 py-1 rounded-full bg-cyan-500/10 text-[#00f2fe] border border-cyan-500/30 animate-pulse">⚡ LIVE FEED</span>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto space-y-4">
        <!-- Post a Job Box -->
        <div class="glass p-4 rounded-2xl shadow-xl">
            <h2 class="text-sm font-semibold mb-3 text-gray-300">Post a Quick Job / Cyber Task</h2>
            <input type="text" id="jobTitle" placeholder="e.g., Print & Bind 20 pages" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-sm mb-3 focus:outline-none focus:border-[#00f2fe]">
            <input type="text" id="jobPayout" placeholder="Payout (e.g., Ksh 500)" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-sm mb-3 focus:outline-none focus:border-[#00f2fe]">
            <button onclick="postJob()" class="w-full bg-gradient-to-r from-[#00f2fe] to-purple-600 text-black font-bold py-3 rounded-xl text-sm shadow-lg">🚀 Publish Instantly</button>
        </div>

        <!-- Live Feed Section -->
        <div>
            <h3 class="text-xs uppercase tracking-widest text-gray-400 mb-3">Active Real-Time Gigs</h3>
            <div id="jobFeed" class="space-y-3">
                <!-- Dynamically loaded jobs -->
            </div>
        </div>
    </main>

    <script>
        async function fetchJobs() {
            const res = await fetch('/api/jobs');
            const jobs = await res.json();
            const feed = document.getElementById('jobFeed');
            feed.innerHTML = jobs.map(j => `
                <div class="glass p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded">${j.type || 'Instant Task'}</span>
                        <h4 class="font-bold text-sm mt-1 text-gray-100">${j.title}</h4>
                        <span class="text-xs text-gray-400">${j.time}</span>
                    </div>
                    <div class="text-right">
                        <span class="text-sm font-black text-[#00f2fe] block">${j.payout}</span>
                        <button onclick="alert('Connecting to provider...')" class="mt-2 text-xs bg-white/10 hover:bg-[#00f2fe] hover:text-black transition px-3 py-1 rounded-lg font-medium">Accept</button>
                    </div>
                </div>
            `).join('');
        }

        async function postJob() {
            const title = document.getElementById('jobTitle').value;
            const payout = document.getElementById('jobPayout').value;
            if(!title || !payout) return alert('Please fill in both fields');

            await fetch('/api/jobs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, payout, type: 'Cyber/Quick Task' })
            });

            document.getElementById('jobTitle').value = '';
            document.getElementById('jobPayout').value = '';
            fetchJobs();
        }

        fetchJobs();
        setInterval(fetchJobs, 5000); // Auto-refresh live feed every 5 seconds
    </script>
</body>
</html>
