<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexx | Live Gigs & Cyber Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .insta-glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(0, 0, 0, 0.06); }
        .tg-bubble { background: #f0f4f8; border-radius: 16px 16px 4px 16px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen font-sans pb-16">

    <!-- Instagram-Style Top Navigation Bar -->
    <header class="sticky top-0 z-50 insta-glass px-4 py-3 flex justify-between items-center border-b border-slate-200">
        <div>
            <h1 class="text-xl font-black tracking-tighter text-blue-600">FLEXX<span class="text-pink-500">.</span></h1>
            <p class="text-[10px] text-slate-500 font-medium">⚡ Live Job Feed & Cyber Channel</p>
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online
            </span>
        </div>
    </header>

    <!-- Main Container (Telegram-Style Chat/Channel Feed + Instagram Card Style) -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Post a Job Box (Instagram Story Creator Vibe) -->
        <div class="insta-glass p-4 rounded-2xl shadow-sm border border-slate-200/80">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Post a Live Gig / Cyber Task</h2>
                <span class="text-[10px] text-blue-600 font-semibold bg-blue-50 px-2 py-0.5 rounded">Instant Broadcast</span>
            </div>
            <input type="text" id="jobTitle" placeholder="What needs to be done? (e.g., KRA Pin / Typing)" class="w-full bg-slate-100 border border-slate-200 rounded-xl p-3 text-sm mb-2.5 focus:outline-none focus:border-blue-500 text-slate-900">
            <div class="flex gap-2 mb-3">
                <input type="text" id="jobCategory" placeholder="Category (e.g., Cyber)" class="w-1/2 bg-slate-100 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-900">
                <input type="text" id="jobPayout" placeholder="Payout (e.g., Ksh 500)" class="w-1/2 bg-slate-100 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 text-slate-900">
            </div>
            <button onclick="postJob()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3 rounded-xl text-sm shadow-md hover:opacity-95 transition">🚀 Broadcast to Providers</button>
        </div>

        <!-- Telegram-Style Channel Feed Header -->
        <div class="flex justify-between items-center px-1">
            <h3 class="text-xs uppercase tracking-wider font-bold text-slate-400">Live Channel Stream</h3>
            <span class="text-xs text-blue-600 font-medium">Auto-syncs live</span>
        </div>

        <!-- Job Feed List -->
        <div id="jobFeed" class="space-y-3">
            <!-- Dynamically injected cards -->
        </div>
    </main>

    <!-- Telegram Style Bottom Navigation / Action Bar -->
    <nav class="fixed bottom-0 left-0 right-0 insta-glass border-t border-slate-200 p-3 max-w-md mx-auto flex justify-around text-slate-600 text-xs font-medium">
        <button class="flex flex-col items-center text-blue-600">
            <span class="text-lg">📢</span> Feed
        </button>
        <button onclick="alert('Chat feature opening soon!')" class="flex flex-col items-center hover:text-blue-600">
            <span class="text-lg">💬</span> Direct Chat
        </button>
        <button onclick="alert('Your Profile & Middleman Wallet')" class="flex flex-col items-center hover:text-blue-600">
            <span class="text-lg">👤</span> Profile
        </button>
    </nav>

    <script>
        async function fetchJobs() {
            const res = await fetch('/api/jobs');
            const jobs = await res.json();
            const feed = document.getElementById('jobFeed');
            feed.innerHTML = jobs.map(j => `
                <div class="insta-glass p-4 rounded-2xl shadow-sm border border-slate-200 transition hover:shadow-md">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center space-x-2">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600 p-0.5 flex items-center justify-center">
                                <div class="w-full h-full bg-white rounded-full flex items-center justify-center text-[10px] font-bold text-slate-700">FX</div>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-slate-800">Client Dispatch</h4>
                                <span class="text-[10px] text-slate-400">${j.time}</span>
                            </div>
                        </div>
                        <span class="text-xs font-black text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full border border-blue-100">${j.payout}</span>
                    </div>

                    <div class="tg-bubble p-3 my-2 text-sm text-slate-800 font-medium">
                        <span class="inline-block text-[10px] uppercase bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded mb-1">${j.type || 'Cyber Service'}</span>
                        <p>${j.title}</p>
                    </div>

                    <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-100">
                        <div class="flex space-x-4 text-xs text-slate-500 font-medium">
                            <button onclick="this.style.color='red'; alert('Liked!')" class="flex items-center gap-1 hover:text-pink-500">❤️ Like</button>
                            <button onclick="alert('Opening direct secure chat with client...')" class="flex items-center gap-1 hover:text-blue-600">💬 Message</button>
                        </div>
                        <button onclick="alert('Job accepted! Connecting you as the middleman service provider.')" class="bg-slate-900 text-white hover:bg-blue-600 transition text-xs font-bold px-4 py-1.5 rounded-xl shadow-sm">
                            Accept Gig
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function postJob() {
            const title = document.getElementById('jobTitle').value;
            const type = document.getElementById('jobCategory').value || 'Cyber Service';
            const payout = document.getElementById('jobPayout').value;
            if(!title || !payout) return alert('Please enter both the job description and payout');

            await fetch('/api/jobs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, payout, type })
            });

            document.getElementById('jobTitle').value = '';
            document.getElementById('jobCategory').value = '';
            document.getElementById('jobPayout').value = '';
            fetchJobs();
        }

        fetchJobs();
        setInterval(fetchJobs, 5000);
    </script>
</body>
</html>
