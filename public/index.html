<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East West | Connect & Chat</title>
    <link rel="manifest" href="/manifest.json">
    <meta id="themeColorMeta" name="theme-color" content="#00a884">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .theme-green { background-color: #00a884; }
        .theme-spider { background-color: #dc2626; }
        .theme-starwars { background-color: #1e293b; }
        .theme-barbie { background-color: #db2777; }
        
        /* Face Colors */
        .face-cream { background-color: #efeae2; color: #1e293b; }
        .face-dark { background-color: #111827; color: #f3f4f6; }
        .face-grey { background-color: #f1f5f9; color: #0f172a; }
        .face-white { background-color: #ffffff; color: #1e293b; }

        /* 3D Text Effect */
        .text-3d {
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3), 4px 4px 0px rgba(0,0,0,0.15);
        }

        /* Animated Glowing Gradient Background */
        body.neon-glow-bg {
            background-color: #000000;
            color: #f3f4f6;
            position: relative;
            overflow-x: hidden;
        }

        body.neon-glow-bg::before,
        body.neon-glow-bg::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.45;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        /* Top-Left / Right Red-Pink Glow */
        body.neon-glow-bg::before {
            top: -50px;
            left: -50px;
            background: linear-gradient(135deg, #dc2626, #db2777);
        }

        /* Bottom-Right Opposite Glow */
        body.neon-glow-bg::after {
            bottom: 0px;
            right: -50px;
            background: linear-gradient(135deg, #db2777, #dc2626);
            animation-delay: 4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.35; }
            50% { transform: scale(1.2); opacity: 0.55; }
            100% { transform: scale(1); opacity: 0.35; }
        }
    </style>
</head>
<body id="appBody" class="neon-glow-bg min-h-screen flex flex-col font-sans transition-colors duration-300">

    <!-- Floating Rounded Top Header -->
    <header class="p-3 sticky top-0 z-50">
        <div id="headerBg" class="theme-green text-white px-4 py-3 flex justify-between items-center shadow-2xl rounded-2xl transition-colors duration-300">
            <div class="flex items-center space-x-3">
                <!-- Back Button -->
                <button onclick="goBack()" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm hover:bg-white/30 transition">←</button>
                
                <!-- Silhouette of a boy with chill sign (✌🏽) + 3D East West Logo -->
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-xl shadow-inner">
                        ✌🏽
                    </div>
                    <div>
                        <h1 id="headerTitle" class="font-black text-lg tracking-wider text-3d uppercase">East West</h1>
                        <p class="text-[9px] text-emerald-100 font-medium tracking-wide">Vibes & Connections</p>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Settings Button -->
                <button onclick="toggleSettings(true)" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-bold text-lg hover:bg-white/30 transition">⋮</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER VIEWS -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-28 overflow-y-auto flex flex-col justify-center">

        <!-- VIEW 1: DASHBOARD / HOME (Plain & Empty Middle Screen) -->
        <div id="screen-menu" class="space-y-4 text-center">
            <!-- Middle screen kept plain and empty as requested -->
        </div>

        <!-- VIEW 2: FIND A DATE -->
        <div id="screen-dating" class="hidden space-y-4">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-xs uppercase tracking-wider font-bold text-pink-400">Local Matches Nearby</h3>
                <span class="text-xs text-pink-500 font-medium">Active now</span>
            </div>
            <div class="bg-slate-900/80 backdrop-blur-md rounded-3xl shadow-lg border border-slate-800 overflow-hidden">
                <div class="h-56 bg-gradient-to-tr from-pink-600 to-rose-600 flex items-end p-4 text-white">
                    <div>
                        <h4 class="text-lg font-bold">Brenda, 22</h4>
                        <p class="text-xs text-pink-100">2 km away • Coffee & Tech lover</p>
                    </div>
                </div>
                <div class="p-4 flex gap-2">
                    <button onclick="alert('Passed!')" class="w-1/2 border border-slate-700 text-slate-300 py-3 rounded-2xl text-xs font-bold hover:bg-slate-800">✕ Pass</button>
                    <button onclick="alert('Matched! Opening secure chat room.')" class="w-1/2 bg-pink-600 text-white py-3 rounded-2xl text-xs font-bold hover:bg-pink-700 shadow">💖 Like & Chat</button>
                </div>
            </div>
        </div>

        <!-- VIEW 3: CHAT ROOM -->
        <div id="screen-chat" class="hidden space-y-3">
            <div id="chatContainer" class="space-y-3">
                <!-- Messages injected here -->
            </div>
        </div>

    </main>

    <!-- Message Input Bar (Only visible in Chat View) -->
    <div id="chatInputBar" class="hidden fixed bottom-16 left-0 right-0 bg-slate-900/90 backdrop-blur-md p-3 border-t border-slate-800 max-w-md mx-auto flex items-center gap-2 z-40">
        <input type="text" id="messageInput" placeholder="Type a message (works offline)..." class="flex-1 bg-slate-800 text-white placeholder-slate-400 border border-slate-700 rounded-full py-2.5 px-4 text-sm focus:outline-none focus:border-emerald-500">
        <button id="sendBtn" onclick="sendMessage()" class="theme-green text-white w-10 h-10 rounded-full flex items-center justify-center shadow hover:opacity-90 transition font-bold text-lg">➤</button>
    </div>

    <!-- BOTTOM MARK-BOOKS NAVIGATION DOCK -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 py-2 px-3 max-w-md mx-auto flex justify-around items-center z-50 shadow-2xl">
        <button onclick="showScreen('menu')" class="flex flex-col items-center text-slate-400 hover:text-emerald-400 transition">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold mt-0.5">Home</span>
        </button>
        <button onclick="showScreen('dating')" class="flex flex-col items-center text-slate-400 hover:text-pink-500 transition">
            <span class="text-xl">💖</span>
            <span class="text-[10px] font-bold mt-0.5">Find Date</span>
        </button>
        <button onclick="showScreen('chat')" class="flex flex-col items-center text-slate-400 hover:text-emerald-400 transition">
            <span class="text-xl">💬</span>
            <span class="text-[10px] font-bold mt-0.5">Chats</span>
        </button>
        <button onclick="syncContacts()" class="flex flex-col items-center text-slate-400 hover:text-blue-400 transition">
            <span class="text-xl">📇</span>
            <span class="text-[10px] font-bold mt-0.5">Contacts</span>
        </button>
        <button onclick="inviteFriends()" class="flex flex-col items-center text-slate-400 hover:text-amber-400 transition">
            <span class="text-xl">🔗</span>
            <span class="text-[10px] font-bold mt-0.5">Invite</span>
        </button>
    </nav>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 text-slate-100 border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 animate-in fade-in duration-200 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-black text-base text-slate-100">⚙️ Settings & Support</h3>
                <button onclick="toggleSettings(false)" class="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center font-bold text-slate-300 hover:bg-slate-700">✕</button>
            </div>

            <!-- Support Details -->
            <div class="space-y-1 bg-slate-800/60 p-3 rounded-2xl border border-slate-700/50 text-xs text-slate-300">
                <p class="font-bold text-slate-200 mb-1">📞 Support & Contact</p>
                <p><b>Phone:</b> +254 700 000 000</p>
                <p><b>Email:</b> support@eastwest.live</p>
            </div>

            <!-- Face Color Picker -->
            <div class="space-y-1.5">
                <label class="font-bold text-xs text-slate-300 block">🎨 App Face Color</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setFaceColor('cream')" class="p-2 rounded-xl bg-[#efeae2] text-slate-800 text-xs font-bold border border-slate-300 shadow-sm">Warm Cream</button>
                    <button onclick="setFaceColor('dark')" class="p-2 rounded-xl bg-[#111827] text-white text-xs font-bold shadow-sm">Dark AMOLED</button>
                    <button onclick="setFaceColor('grey')" class="p-2 rounded-xl bg-[#f1f5f9] text-slate-800 text-xs font-bold border border-slate-200 shadow-sm">Cool Grey</button>
                    <button onclick="setFaceColor('white')" class="p-2 rounded-xl bg-white text-slate-800 text-xs font-bold border border-slate-200 shadow-sm">Clean White</button>
                </div>
            </div>

            <!-- Theme Picker (Separate) -->
            <div class="space-y-1.5">
                <label class="font-bold text-xs text-slate-300 block">✨ Header & Accent Themes</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setTheme('green')" class="p-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow-sm">Classic Green</button>
                    <button onclick="setTheme('spider')" class="p-2.5 rounded-xl bg-red-600 text-white text-xs font-bold shadow-sm">Spider-Man</button>
                    <button onclick="setTheme('starwars')" class="p-2.5 rounded-xl bg-slate-800 text-white text-xs font-bold shadow-sm">Star Wars</button>
                    <button onclick="setTheme('barbie')" class="p-2.5 rounded-xl bg-pink-600 text-white text-xs font-bold shadow-sm">Barbie</button>
                </div>
            </div>

            <!-- Project Tag -->
            <div class="pt-2 border-t border-slate-800 text-center">
                <span class="text-[10px] bg-slate-800 text-slate-400 font-bold px-3 py-1 rounded-full">🚀 Ongoing Project: East West v2.0</span>
            </div>
        </div>
    </div>

    <script>
        let currentTheme = localStorage.getItem('eastwest_theme') || 'green';
        let currentFace = localStorage.getItem('eastwest_face') || 'neon';
        setTheme(currentTheme, false);

        function setTheme(theme, save = true) {
            currentTheme = theme;
            if(save) localStorage.setItem('eastwest_theme', theme);

            const headerBg = document.getElementById('headerBg');
            const sendBtn = document.getElementById('sendBtn');
            const themeColorMeta = document.getElementById('themeColorMeta');

            headerBg.className = "text-white px-4 py-3 flex justify-between items-center shadow-2xl rounded-2xl transition-colors duration-350 " + 
                (theme === 'spider' ? 'theme-spider' : theme === 'starwars' ? 'theme-starwars' : theme === 'barbie' ? 'theme-barbie' : 'theme-green');

            if(sendBtn) {
                sendBtn.className = "text-white w-10 h-10 rounded-full flex items-center justify-center shadow hover:opacity-90 transition font-bold text-lg " + 
                    (theme === 'spider' ? 'theme-spider' : theme === 'starwars' ? 'theme-starwars' : theme === 'barbie' ? 'theme-barbie' : 'theme-green');
            }

            themeColorMeta.setAttribute('content', theme === 'spider' ? '#dc2626' : theme === 'starwars' ? '#1e293b' : theme === 'barbie' ? '#db2777' : '#00a884');
            toggleSettings(false);
        }

        function setFaceColor(face, save = true) {
            const body = document.getElementById('appBody');
            if(face === 'dark') {
                body.className = "face-dark min-h-screen flex flex-col font-sans transition-colors duration-300";
            } else if(face === 'grey') {
                body.className = "face-grey min-h-screen flex flex-col font-sans transition-colors duration-300";
            } else if(face === 'white') {
                body.className = "face-white min-h-screen flex flex-col font-sans transition-colors duration-300";
            } else if(face === 'cream') {
                body.className = "face-cream min-h-screen flex flex-col font-sans transition-colors duration-300";
            } else {
                body.className = "neon-glow-bg min-h-screen flex flex-col font-sans transition-colors duration-300";
            }
            toggleSettings(false);
        }

        function showScreen(screen) {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-dating').classList.add('hidden');
            document.getElementById('screen-chat').classList.add('hidden');
            document.getElementById('chatInputBar').classList.add('hidden');

            if(screen === 'menu') {
                document.getElementById('screen-menu').classList.remove('hidden');
            } else if(screen === 'dating') {
                document.getElementById('screen-dating').classList.remove('hidden');
            } else if(screen === 'chat') {
                document.getElementById('screen-chat').classList.remove('hidden');
                document.getElementById('chatInputBar').classList.remove('hidden');
                renderMessages();
            }
        }

        function goBack() {
            showScreen('menu');
        }

        function toggleSettings(show) {
            const modal = document.getElementById('settingsModal');
            if(show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        async function syncContacts() {
            alert('📇 Contacts synced successfully from device!');
        }

        function inviteFriends() {
            const inviteText = "Join me on East West! Download it here: " + window.location.origin;
            if (navigator.share) {
                navigator.share({ title: 'East West Invite', text: inviteText, url: window.location.origin });
            } else {
                navigator.clipboard.writeText(inviteText);
                alert('Invite link copied to clipboard!');
            }
        }

        // Chat logic
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        let messages = JSON.parse(localStorage.getItem('eastwest_msgs') || '[]');

        function renderMessages() {
            chatContainer.innerHTML = `
                <div class="flex justify-start">
                    <div class="bg-slate-800 text-slate-100 p-3 max-w-[80%] rounded-2xl shadow-sm text-sm border border-slate-700">
                        <p class="font-bold text-xs text-emerald-400 mb-0.5">East West System</p>
                        <p>Welcome! Offline messages queue locally and auto-sync when online.</p>
                        <span class="text-[9px] text-slate-400 block text-right mt-1">Just now</span>
                    </div>
                </div>
            `;
            messages.forEach(msg => {
                chatContainer.innerHTML += `
                    <div class="flex justify-end">
                        <div class="bg-emerald-600 text-white p-3 max-w-[80%] rounded-2xl shadow-sm text-sm">
                            <p>${msg.text}</p>
                            <div class="flex justify-end items-center gap-1 mt-1">
                                <span class="text-[9px] text-slate-200">${msg.time}</span>
                                <span class="text-[10px] font-bold ${msg.synced ? 'text-cyan-200' : 'text-amber-300'}">
                                    ${msg.synced ? '✓✓' : '⏱ Queued'}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if(!text) return;
            const newMsg = {
                id: Date.now(),
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                synced: navigator.onLine
            };
            messages.push(newMsg);
            localStorage.setItem('eastwest_msgs', JSON.stringify(messages));
            messageInput.value = '';
            renderMessages();

            if (navigator.onLine) {
                setTimeout(() => {
                    newMsg.synced = true;
                    localStorage.setItem('eastwest_msgs', JSON.stringify(messages));
                    renderMessages();
                }, 800);
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
